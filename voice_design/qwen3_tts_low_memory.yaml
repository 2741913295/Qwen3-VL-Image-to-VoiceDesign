# Low-memory Qwen3-TTS VoiceDesign deployment for serial image-to-audio jobs.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 1

stages:
  - stage_id: 0
    # This project submits one VoiceDesign request at a time.
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    # One GiB is sufficient for one 4096-token talker request and avoids
    # vLLM reserving roughly 24 GiB from a percentage of an 80 GiB GPU.
    kv_cache_memory_bytes: 1073741824
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 32768
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      top_p: 1.0
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    # Code2Wav does not use a normal autoregressive KV cache, but lowering
    # max_num_seqs also reduces unnecessary serial-workload graph buckets.
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0

platforms:
  rocm:
    stages:
      - stage_id: 1
        enforce_eager: true
  npu:
    stages:
      - stage_id: 0
        enforce_eager: false
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        compilation_config:
          cudagraph_mode: PIECEWISE
